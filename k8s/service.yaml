apiVersion: v1
kind: Service
metadata:
  name: my-webapp-service
  namespace: production
  labels:
    app: my-webapp
    app.kubernetes.io/name: my-webapp
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: my-webapp
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
