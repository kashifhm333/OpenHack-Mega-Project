name: Push Build Image To ACR & Deploy to AKS

on:
  push:
    branches:
      - main

env:
  AZURE_RESOURCE_GROUP: rg-prod-k8s
  AZURE_CLUSTER_NAME: aks-prod-cluster
  AZURE_ACR_NAME: acrprodminimal101
  APP_NAME: my-webapp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.AZURE_ACR_NAME }}

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ github.sha }}
            ${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to AKS Cluster
        run: |
          az aks get-credentials --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.AZURE_CLUSTER_NAME }} --overwrite-existing

      - name: Ensure Kubernetes Namespace Exists
        run: |
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes Manifests (Config/Deployment/Service)
        run: |
          if [ -d "k8s" ] && [ "$(ls -A k8s/*.yaml 2>/dev/null || ls -A k8s/*.yml 2>/dev/null)" ]; then
            kubectl apply -f k8s/ -n production
          else
            echo "No k8s manifests found in k8s/, skipping manifest apply."
          fi

      - name: Restart Kubernetes Deployment to Pull New Image
        run: |
          if kubectl get deployment/${{ env.APP_NAME }}-deployment -n production >/dev/null 2>&1; then
            kubectl rollout restart deployment/${{ env.APP_NAME }}-deployment -n production
          else
            echo "Deployment ${{ env.APP_NAME }}-deployment not yet created in production namespace, skipping rollout restart."
          fi
