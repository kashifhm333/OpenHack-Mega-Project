name: Push Build Image To ECR & Deploy to EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: my-webapp
  EKS_CLUSTER_NAME: eks-prod-cluster
  APP_NAME: my-webapp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to EKS Cluster
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Ensure Kubernetes Namespace Exists
        run: |
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes Manifests (Config/Deployment/Service/HPA/PDB)
        run: |
          if [ -d "k8s" ] && [ "$(ls -A k8s/*.yaml 2>/dev/null || ls -A k8s/*.yml 2>/dev/null)" ]; then
            kubectl apply -f k8s/ -n production
          else
            echo "No k8s manifests found in k8s/, skipping manifest apply."
          fi

      - name: Update Deployment Image & Verify Zero-Downtime Rollout
        run: |
          if kubectl get deployment/${{ env.APP_NAME }}-deployment -n production >/dev/null 2>&1; then
            echo "Deploying immutable image tag: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
            kubectl set image deployment/${{ env.APP_NAME }}-deployment ${{ env.APP_NAME }}=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} -n production
            kubectl rollout status deployment/${{ env.APP_NAME }}-deployment -n production --timeout=180s
          else
            echo "Deployment ${{ env.APP_NAME }}-deployment not yet created in production namespace, skipping rollout status check."
          fi
